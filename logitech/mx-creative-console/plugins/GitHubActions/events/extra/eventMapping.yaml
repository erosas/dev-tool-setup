# Waveform played on haptic devices (MX Master 4) for each plugin event.
# Event names must match the constants of HapticNotifier (src/Helpers/HapticNotifier.cs).
# Both events use the same short pulse: a success raises its event once
# (1 vibration), a failure or cancellation raises its event twice (2 vibrations).
# Available waveforms: sharp_state_change, damp_state_change, sharp_collision,
# damp_collision, subtle_collision, happy_alert, angry_alert, completed, square,
# wave, firework, mad, knock, jingle, ringing.

haptics:
    workflowSucceeded:
        DEFAULT: sharp_state_change
    workflowFailed:
        DEFAULT: sharp_state_change
